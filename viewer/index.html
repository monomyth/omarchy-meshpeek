<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mesh Peek</title>
  <style>
    html, body { margin: 0; height: 100%; background: #45464c; overflow: hidden; font-family: system-ui, sans-serif; }
    #hud { position: absolute; left: 12px; bottom: 10px; color: #c8c8cc; font-size: 12px; opacity: 0.9; pointer-events: none; }
    #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #f66; padding: 24px; text-align: center; background: #2a2b2f; z-index: 2; }
  </style>
</head>
<body>
  <div id="hud">loading…</div>
  <div id="err"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js"
    }
  }
  </script>
  <script type="module">
    const errEl = document.getElementById('err');
    const hud = document.getElementById('hud');
    function fail(msg) {
      errEl.style.display = 'flex';
      errEl.textContent = msg;
      console.error(msg);
    }
    window.addEventListener('error', (e) => fail('JS: ' + (e.message || e.error)));
    window.addEventListener('unhandledrejection', (e) => fail('Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

    import * as THREE from 'three';
    import { STLLoader } from './vendor/three/examples/jsm/loaders/STLLoader.js';

    const params = new URLSearchParams(location.search);
    const fileUrl = params.get('file');
    const upAxis = (params.get('up') || '+Z').toUpperCase();
    if (!fileUrl) { fail('Missing ?file='); throw new Error('no file'); }

    function upVector(axis) {
      switch (axis) {
        case '+Y': return new THREE.Vector3(0, 1, 0);
        case '-Y': return new THREE.Vector3(0, -1, 0);
        case '-Z': return new THREE.Vector3(0, 0, -1);
        case '+Z':
        default: return new THREE.Vector3(0, 0, 1);
      }
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x45464c);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 5000);
    camera.up.copy(upVector(upAxis));

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setClearColor(0x45464c, 1);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const key = new THREE.DirectionalLight(0xffffff, 1.15);
    const fill = new THREE.DirectionalLight(0xffffff, 0.4);
    scene.add(key); scene.add(fill);

    const grid = new THREE.GridHelper(20, 20, 0x6a6b70, 0x505156);
    if (upAxis === '+Z' || upAxis === '-Z') grid.rotation.x = Math.PI / 2;
    scene.add(grid);
    scene.add(new THREE.AxesHelper(1));

    const clay = new THREE.MeshStandardMaterial({ color: 0xe8e8ec, roughness: 0.4, metalness: 0.0 });

    // Minimal orbit (no OrbitControls addon)
    const target = new THREE.Vector3();
    let sph = new THREE.Spherical(3, Math.PI / 2 - 0.49, 0.7); // elev~28°, az~40°
    let dragging = false, button = 0, lastX = 0, lastY = 0;
    function placeCam() {
      camera.position.setFromSpherical(sph).add(target);
      camera.lookAt(target);
    }
    placeCam();
    renderer.domElement.addEventListener('pointerdown', (e) => {
      dragging = true; button = e.button; lastX = e.clientX; lastY = e.clientY;
      renderer.domElement.setPointerCapture(e.pointerId);
    });
    renderer.domElement.addEventListener('pointerup', () => { dragging = false; });
    renderer.domElement.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      if (button === 0) {
        sph.theta -= dx * 0.005;
        sph.phi = Math.min(Math.max(0.05, sph.phi + dy * 0.005), Math.PI - 0.05);
      } else {
        const pan = new THREE.Vector3();
        const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
        const up = camera.up.clone().normalize();
        pan.addScaledVector(right, -dx * sph.radius * 0.0015);
        pan.addScaledVector(up, dy * sph.radius * 0.0015);
        target.add(pan);
      }
      placeCam();
    });
    renderer.domElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      sph.radius = Math.min(Math.max(sph.radius * (e.deltaY > 0 ? 1.1 : 0.9), 0.05), 5000);
      placeCam();
    }, { passive: false });
    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

    function fit(object) {
      object.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(object);
      const center = box.getCenter(new THREE.Vector3());
      object.position.sub(center);
      object.updateMatrixWorld(true);
      const box2 = new THREE.Box3().setFromObject(object);
      const size2 = box2.getSize(new THREE.Vector3());
      const maxDim = Math.max(size2.x, size2.y, size2.z) || 1;
      if (upAxis === '+Z' || upAxis === '-Z') {
        grid.position.set(0, 0, box2.min.z);
        key.position.set(maxDim * 2, maxDim * 1.2, maxDim * 3);
        fill.position.set(-maxDim * 1.5, -maxDim * 0.8, maxDim * 0.6);
      } else {
        grid.position.set(0, box2.min.y, 0);
        key.position.set(3, 5, 2);
        fill.position.set(-2, 1, -1);
      }
      const footprint = Math.max(size2.x, size2.y, size2.z) * 2.5;
      grid.scale.setScalar(Math.max(footprint / 20, 0.05));
      sph.radius = maxDim * 2.4;
      target.set(0, 0, 0);
      placeCam();
      camera.near = maxDim / 200;
      camera.far = maxDim * 50;
      camera.updateProjectionMatrix();
    }

    function addMesh(geom) {
      geom.computeVertexNormals();
      const mesh = new THREE.Mesh(geom, clay);
      scene.add(mesh);
      fit(mesh);
    }

    const name = decodeURIComponent(fileUrl.split('/').pop().split('?')[0]).toLowerCase();
    hud.textContent = name + ' · ' + upAxis + ' up · drag · scroll zoom · right-drag pan';

    async function load() {
      if (/\.stl$/i.test(name)) {
        addMesh(await new STLLoader().loadAsync(fileUrl));
      } else if (/\.3mf$/i.test(name)) {
        const { ThreeMFLoader } = await import('./vendor/three/examples/jsm/loaders/3MFLoader.js');
        const obj = await new ThreeMFLoader().loadAsync(fileUrl);
        scene.add(obj); fit(obj);
      } else if (/\.obj$/i.test(name)) {
        const { OBJLoader } = await import('./vendor/three/examples/jsm/loaders/OBJLoader.js');
        const obj = await new OBJLoader().loadAsync(fileUrl);
        obj.traverse((c) => { if (c.isMesh) c.material = clay; });
        scene.add(obj); fit(obj);
      } else if (/\.(gltf|glb)$/i.test(name)) {
        const { GLTFLoader } = await import('./vendor/three/examples/jsm/loaders/GLTFLoader.js');
        const g = await new GLTFLoader().loadAsync(fileUrl);
        scene.add(g.scene); fit(g.scene);
      } else {
        fail('Unsupported: ' + name);
      }
    }
    load().catch((e) => fail('Load failed: ' + (e && e.message ? e.message : e)));

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    (function tick() {
      requestAnimationFrame(tick);
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
